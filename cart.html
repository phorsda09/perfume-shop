<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LDR-SHOP - Cart</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

</head>
<body>
   <!-- Navbar -->
  <header class="navbar">
    <div class="logo">LDR-SHOP</div>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="index.html#about">About</a>
      <a href="products.html" class="active">Products</a>
      <a href="index.html#contact">Contact</a>
      <a href="cart.html" class="cart-link">
        <i class="fas fa-shopping-cart"></i>
        <span id="cart-count" class="cart-badge">0</span>
      </a>
    </nav>
    <div class="menu-toggle" id="menuToggle">
      <i class="fas fa-bars"></i>
    </div>
  </header>

  <!-- Cart Section -->
  <section class="cart-section">
    <h2>Your Cart</h2>
    <div class="cart-items" id="cart-items">
      <!-- Cart items will be dynamically inserted here -->
    </div>
    <div class="cart-summary">
      <p>Total: $<span id="cart-total">0</span></p>
      <button class="back-btn" onclick="location.href='products.html'">Back to Shop</button>
      <button type="button" onclick="location.href='checkout.html'" class="checkout-btn">
       Proceed to Checkout
      </button>
      

    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
